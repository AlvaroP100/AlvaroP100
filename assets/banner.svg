<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Alvaro Patru</title>
  <desc id="d">Software, infrastructure, automation, and AI.</desc>
  <style>
    :root { --bg1:#fbfbfd; --bg2:#eef0f5; --fg:#1d1d1f; --sub:#6e6e73; --glow:#ff3b30; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#0b0b0d; --bg2:#17171b; --fg:#f5f5f7; --sub:#a1a1a6; --glow:#ff453a; }
    }
    .name { font: 600 76px -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.03em; fill: var(--fg); }
    .tag  { font: 400 28px -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0; fill: var(--sub); }
    @media (prefers-reduced-motion: no-preference) {
      .orb { animation: breathe 9s ease-in-out infinite; transform-origin: 1010px 160px; }
    }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.08); opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="var(--glow)" stop-opacity=".55"/>
      <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle class="orb" cx="1010" cy="160" r="170" fill="url(#orb)"/>
  <text class="name" x="72" y="156">Alvaro Patru</text>
  <text class="tag" x="72" y="208">Software, infrastructure, automation, and AI.</text>
</svg>
