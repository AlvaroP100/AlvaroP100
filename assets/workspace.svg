<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t">
  <title id="t">My workspace: Apps and websites (Scooly Notes, personal websites), systems and workflows (connected workflows, infrastructure, data and security), and a short profile card.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2228"/><stop offset=".55" stop-color="#353f44"/><stop offset="1" stop-color="#b98582"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181818" stop-opacity=".82"/><stop offset=".5" stop-color="#252525" stop-opacity=".62"/><stop offset="1" stop-color="#9a9a9a" stop-opacity=".34"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif; fill: #f5f5f5; }
    .h { font-size: 28px; letter-spacing: -0.02em; }
    .ch { font-size: 15px; font-weight: 500; }
    .ct { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
    .cd { font-size: 15px; fill-opacity: .62; }
    .tg { font-size: 12.5px; fill-opacity: .45; letter-spacing: .02em; }
    .sm { font-size: 13px; fill-opacity: .5; }
    .card { fill: #fff; fill-opacity: .07; stroke: #fff; stroke-opacity: .08; }
    .pill { fill: #fff; fill-opacity: .08; stroke: #fff; stroke-opacity: .1; }
    .ico { fill: none; stroke: #f5f5f5; stroke-opacity: .55; stroke-width: 1.8; }
    .badge { fill: #fff; fill-opacity: .12; }
    @media (prefers-reduced-motion: no-preference) {
      .col { animation: rise .8s cubic-bezier(.2,.8,.2,1) backwards; }
      .c2 { animation-delay: .1s } .c3 { animation-delay: .2s }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } }
  </style>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <rect x="40" y="24" width="1120" height="552" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>

  <!-- sidebar -->
  <rect x="62" y="46" width="44" height="44" rx="12" fill="#0d0d0d"/>
  <g transform="translate(70 59)" fill="none" stroke="#f5f5f5" stroke-width="2.4"><path d="M0 0H12L4 16"/><path d="M28 0H16L24 16"/></g>
  <g class="ico"><circle cx="84" cy="150" r="5"/><path d="M74 168c1-6 5-8 10-8s9 2 10 8"/>
    <rect x="74" y="205" width="8" height="8" rx="2"/><rect x="86" y="205" width="8" height="8" rx="2"/><rect x="74" y="217" width="8" height="8" rx="2"/><rect x="86" y="217" width="8" height="8" rx="2"/>
    <rect x="75" y="262" width="18" height="14" rx="3"/></g>
  <line x1="122" y1="40" x2="122" y2="560" stroke="#fff" stroke-opacity=".08"/>

  <!-- top bar -->
  <rect x="146" y="50" width="250" height="42" rx="12" class="pill"/>
  <circle cx="168" cy="70" r="5.5" class="ico"/><path d="M172 74l5 5" class="ico"/>
  <text class="sm" x="188" y="76">Search my work</text>
  <rect x="948" y="50" width="182" height="42" rx="12" fill="#f5f5f5"/>
  <text x="970" y="76" style="font-size:15px;font-weight:500;fill:#151515">Explore projects ↗</text>

  <text class="h" x="146" y="148">My workspace</text>
  <rect x="338" y="123" width="170" height="34" rx="17" class="pill"/>
  <rect x="342" y="127" width="82" height="26" rx="13" fill="#0d0d0d"/>
  <text x="366" y="145" style="font-size:13px;font-weight:500">Board</text>
  <text x="446" y="145" style="font-size:13px;fill-opacity:.6">List</text>

  <!-- column 1 -->
  <g class="col">
    <text class="ch" x="146" y="208">Apps &amp; websites</text><rect x="292" y="194" width="22" height="20" rx="10" class="badge"/><text x="299" y="209" style="font-size:12px">2</text>
    <rect x="146" y="226" width="318" height="162" rx="18" class="card"/>
    <text class="ct" x="168" y="272">Scooly Notes</text><text class="cd" x="168" y="302">A place for handwritten ideas.</text><text class="tg" x="168" y="358">Swift · iPad · PencilKit</text>
    <rect x="146" y="404" width="318" height="162" rx="18" class="card"/>
    <text class="ct" x="168" y="450">Personal websites</text><text class="cd" x="168" y="480">A home for the things I make.</text><text class="tg" x="168" y="536">Web · Identity · Publishing</text>
  </g>
  <!-- column 2 -->
  <g class="col c2">
    <text class="ch" x="482" y="208">Systems &amp; workflows</text><rect x="672" y="194" width="22" height="20" rx="10" class="badge"/><text x="679" y="209" style="font-size:12px">2</text>
    <rect x="482" y="226" width="318" height="162" rx="18" class="card"/>
    <text class="ct" x="504" y="272">Connected workflows</text><text class="cd" x="504" y="302">Making the tools work together.</text><text class="tg" x="504" y="358">Automation · APIs · AI</text>
    <rect x="482" y="404" width="318" height="162" rx="18" class="card"/>
    <text class="ct" x="504" y="450">Behind the interface</text><text class="cd" x="504" y="480">The systems that keep it running.</text><text class="tg" x="504" y="536">Infrastructure · Data · Security</text>
  </g>
  <!-- column 3 -->
  <g class="col c3">
    <text class="ch" x="818" y="208">Behind the work</text><rect x="958" y="194" width="30" height="20" rx="10" class="badge"/><text x="965" y="209" style="font-size:12px">01</text>
    <rect x="818" y="226" width="312" height="340" rx="18" class="card"/>
    <rect x="842" y="254" width="56" height="56" rx="16" fill="#0d0d0d"/>
    <g transform="translate(852 270)" fill="none" stroke="#f5f5f5" stroke-width="2.6"><path d="M0 0H14L5 20"/><path d="M36 0H22L31 20"/></g>
    <text class="ct" x="842" y="352" style="font-size:24px">Alvaro Patru</text>
    <text class="cd" x="842" y="380">@AlvaroP100</text>
    <text class="cd" x="842" y="428" style="fill-opacity:.8">I build apps, connect systems,</text>
    <text class="cd" x="842" y="452" style="fill-opacity:.8">and keep improving the details.</text>
    <rect x="842" y="488" width="150" height="40" rx="20" class="pill"/><text x="868" y="513" style="font-size:14px">A little about me</text>
  </g>
</svg>
