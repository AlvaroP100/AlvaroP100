<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Alvaro Holo terminal banner</title>
  <desc id="description">An animated red ASCII Holo mark made from a normal seven followed by a flipped seven on a charcoal terminal background.</desc>

  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#18181c"/>
    </pattern>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: signal-shift 7s steps(1, end) infinite; }
      .scan { animation: scan-pass 5.5s linear infinite; }
      .cursor { animation: cursor-blink 1.1s step-end infinite; }
    }

    @keyframes signal-shift {
      0%, 93%, 97%, 100% { transform: translateX(0); }
      94% { transform: translateX(3px); }
      95% { transform: translateX(-2px); }
      96% { transform: translateX(1px); }
    }

    @keyframes scan-pass {
      from { transform: translateY(0); }
      to { transform: translateY(420px); }
    }

    @keyframes cursor-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
  </style>

  <rect width="1200" height="420" fill="#0d0d10"/>
  <rect width="1200" height="420" fill="url(#scanlines)" opacity="0.72"/>
  <rect x="0" y="0" width="10" height="420" fill="#e24b52"/>
  <rect class="scan" x="10" y="0" width="1190" height="2" fill="#e24b52" opacity="0.24"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="48" y="48" font-size="18" fill="#8d8d98">alvaro@github:~$</text>
    <text x="244" y="48" font-size="18" fill="#e24b52">./holo --order=normal,flipped</text>
    <rect class="cursor" x="553" y="30" width="9" height="21" fill="#e24b52"/>

    <g class="signal" font-size="43" font-weight="700" fill="#e24b52">
      <text x="300" y="112">7777777</text>
      <text x="650" y="112">7777777</text>
      <text x="430" y="154">77</text>
      <text x="650" y="154">77</text>
      <text x="405" y="196">77</text>
      <text x="675" y="196">77</text>
      <text x="380" y="238">77</text>
      <text x="700" y="238">77</text>
      <text x="355" y="280">77</text>
      <text x="725" y="280">77</text>
      <text x="330" y="322">77</text>
      <text x="750" y="322">77</text>
    </g>

    <text x="48" y="394" font-size="17" fill="#e24b52">// build systems, not screenshots</text>
  </g>
</svg>
